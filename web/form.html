{% extends "base.html" %}{% block judul %}Form {{ jam }}{% endblock %}
{% block isi %}
<div class="kartu" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5">
  <a class="tombol" href="/?tanggal={{ tanggal }}">◀ Dashboard</a><h2 style="margin:0;font-size:17px">{{ tanggal }} &nbsp; {{ jam }} UTC</h2>
  <span id="status-kirim"></span><span style="flex:1"></span>
  <label>Observer <select id="observer"><option value="">— pilih —</option>{% for o in observers %}<option {{ 'selected' if o==observer }}>{{ o }}</option>{% endfor %}</select></label>
</div>
<div id="pesan"></div>
<div class="kartu" id="alat" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <button id="salin">⧉ Salin dari {{ prev[1] }} UTC</button>
  <span class="redup">Template cepat:</span><button class="t" data-t="cerah">Cerah (0 okta)</button><button class="t" data-t="hujan">Hujan ringan (cuaca saja)</button>
</div>
<div id="form"></div>
<div class="kartu" id="temuan-box"><h2>Pemeriksaan</h2><div id="temuan" class="redup">memuat…</div></div>
<div class="kartu" style="display:flex;gap:10px;position:sticky;bottom:0;z-index:5">
  <button class="utama" id="simpan" disabled>Simpan</button><button class="bahaya" id="hapus">Hapus data jam ini</button>
  <span id="infosimpan" class="redup"></span>
</div>
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 16px}
.f{display:flex;flex-direction:column;gap:3px}.f label{font-size:13px;color:var(--redup)}.f label b{color:var(--merah)}
.f select,.f input{width:100%}.f.mati{opacity:.35}.f.mati select,.f.mati input{background:#eef0f3}
.f.err select,.f.err input{border-color:var(--merah);background:#fff6f6}.f.wrn select,.f.wrn input{border-color:var(--kuning)}
.fm{font-size:12px}.fm.e{color:var(--merah)}.fm.w{color:var(--kuning)}.fm.i{color:var(--redup)}
.sub{grid-column:1/-1;font-weight:600;color:#0f2f57;margin-top:8px;border-top:1px dashed var(--garis);padding-top:8px}
.tm{padding:5px 0;border-bottom:1px solid var(--garis)}.tm:last-child{border:0}.lv-ERROR{color:var(--merah);font-weight:600}.lv-WARNING{color:var(--kuning);font-weight:600}.lv-INFO{color:var(--redup)}
</style>
<script>
const TANGGAL="{{ tanggal }}",JAM="{{ jam }}",PREV={tanggal:"{{ prev[0] }}",jam:"{{ prev[1] }}"};
const $=s=>document.querySelector(s);let SKEMA,STATE={},ADA_ERROR=true,TIMER=null,DIRTY=false;const TOUCHED=new Set();
function esc(s){return (s||"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function bangun(){
 $("#form").innerHTML=SKEMA.bagian.map(b=>`<div class="kartu"><h2>${b.judul}</h2><div class="grid">${b.field.map(f=>{
  const sub=f.sub?`<div class="sub">${f.sub}</div>`:"";let in_;
  if(f.jenis==="pilih")in_=`<select data-k="${f.kolom}"><option value=""></option>${f.opsi.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
  else if(f.jenis==="saklar")in_=`<select data-k="${f.kolom}"><option value=""></option><option value="true">Ya</option><option value="false">Tidak</option></select>`;
  else in_=`<input type="number" step="any" min="0" data-k="${f.kolom}" placeholder="${f.satuan||''}">`;
  return `${sub}<div class="f" data-w="${f.kolom}"><label>${f.label}${f.satuan?` (${f.satuan})`:''}<b class="bt"></b></label>${in_}<div class="fm"></div></div>`}).join("")}</div></div>`).join("");
 document.querySelectorAll("[data-k]").forEach(e=>{e.oninput=e.onchange=()=>{DIRTY=true;TOUCHED.add(e.dataset.k);jadwal()}});
}
function ambil(){const d={};document.querySelectorAll("[data-k]").forEach(e=>{if(e.disabled)return;const v=e.value.trim();if(v==="")return;
  d[e.dataset.k]=e.type==="number"?parseFloat(v):(v==="true"?true:v==="false"?false:v)});return d}
function isiData(d){document.querySelectorAll("[data-k]").forEach(e=>{const v=d[e.dataset.k];e.value=(v===undefined||v===null)?"":String(v)})}
function terapkan(S,temuan){
 STATE=S;const per={};(temuan||[]).forEach(t=>{(per[t.kolom]=per[t.kolom]||[]).push(t)});
 SKEMA.bagian.forEach(b=>b.field.forEach(f=>{const k=f.kolom,s=S[k]||{aktif:true},w=document.querySelector(`[data-w="${k}"]`),el=w.querySelector("[data-k]");
  w.classList.toggle("mati",!s.aktif);el.disabled=!s.aktif;if(!s.aktif&&el.value!=="")el.value="";
  w.querySelector(".bt").textContent=s.wajib?" *":"";
  if(f.jenis==="pilih"&&s.pilihan){const cur=el.value,ops=s.pilihan;el.innerHTML='<option value=""></option>'+ops.map(o=>`<option>${esc(o)}</option>`).join("");el.value=ops.includes(cur)?cur:""}
  else if(f.jenis==="pilih"&&el.options.length<=1){}
  const ts0=per[k]||[],ts=ts0.filter(t=>!(t.level==="ERROR"&&/wajib/i.test(t.pesan)&&!TOUCHED.has(k)));w.classList.toggle("err",ts.some(t=>t.level==="ERROR"));w.classList.toggle("wrn",!ts.some(t=>t.level==="ERROR")&&ts.some(t=>t.level==="WARNING"));
  const m=w.querySelector(".fm");m.className="fm "+(ts.some(t=>t.level==="ERROR")?"e":ts.some(t=>t.level==="WARNING")?"w":"i");
  m.textContent=ts.length?ts[0].pesan:(ts0.length?"wajib diisi":(s.alasan||""))}));
 const T=(temuan||[]).filter(t=>t.level!=="INFO"||true);
 $("#temuan").innerHTML=T.length?T.map(t=>`<div class="tm"><span class="lv-${t.level}">${t.level}</span> ${t.kolom?`<small>[${t.kolom}]</small> `:''}${esc(t.pesan)} <small>(${t.rule})</small></div>`).join(""):'<span style="color:var(--hijau)">✔ Tidak ada temuan</span>';
}
function jadwal(){clearTimeout(TIMER);TIMER=setTimeout(periksa,250)}
async function periksa(){
 const r=await fetch("/api/validasi",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tanggal:TANGGAL,jam:JAM,data:ambil()})});
 if(r.status===401){location.href="/login";return}const j=await r.json();terapkan(j.state,j.temuan);ADA_ERROR=!j.ok;
 $("#simpan").disabled=ADA_ERROR||!$("#observer").value;$("#infosimpan").textContent=ADA_ERROR?"Perbaiki kesalahan (merah) dulu":(!$("#observer").value?"Pilih observer":"");
}
function pesan(t,ok){$("#pesan").innerHTML=`<div class="msg ${ok?'ok':'err'}">${esc(t)}</div>`;scrollTo(0,0)}
$("#observer").onchange=e=>{document.cookie="observer="+encodeURIComponent(e.target.value)+";path=/;max-age=31536000";periksa()};
async function simpan(paksa){
 const r=await fetch("/api/simpan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tanggal:TANGGAL,jam:JAM,data:ambil(),observer:$("#observer").value,paksa:!!paksa})});
 const j=await r.json();
 if(r.status===409&&j.perlu_konfirmasi){if(confirm(j.pesan))return simpan(true);return}
 if(j.ok){DIRTY=false;pesan("Tersimpan ✔ — bot akan mengirim pada jamnya.",true)}else{pesan(j.pesan||"gagal menyimpan",false);if(j.temuan)terapkan(STATE,j.temuan)}
}
$("#simpan").onclick=()=>simpan(false);
$("#hapus").onclick=async()=>{if(!confirm("Hapus data jam ini?"))return;const r=await fetch("/api/hapus",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tanggal:TANGGAL,jam:JAM})});
 const j=await r.json();if(j.ok){isiData({});DIRTY=false;periksa();pesan("Data dihapus",true)}else pesan(j.pesan,false)};
$("#salin").onclick=async()=>{const r=await fetch(`/api/salin?tanggal=${TANGGAL}&jam=${JAM}`);if(!r.ok){pesan(`Tidak ada data pada ${PREV.tanggal} ${PREV.jam} UTC`,false);return}
 const j=await r.json();isiData(j.data);DIRTY=true;await periksa();await periksa();pesan(`Disalin dari ${j.dari.join(" ")} UTC — periksa lagi sebelum menyimpan`,true)};
function kode(k,c){const f=SKEMA.bagian.flatMap(b=>b.field).find(x=>x.kolom===k);return(f.opsi||[]).find(o=>o.split(" ")[0]===c)||""}
const TEMPLATE={cerah:()=>({cloud_cover_oktas_m:kode("cloud_cover_oktas_m","0"),visibility:10,ww:kode("ww","00"),w1:kode("w1","0"),w2:kode("w2","0"),land_cond:kode("land_cond","0")}),
 hujan:()=>({ww:kode("ww","61"),w1:kode("w1","6"),w2:kode("w2","6"),land_cond:kode("land_cond","2"),visibility:5})};
document.querySelectorAll(".t").forEach(b=>b.onclick=async()=>{const d=Object.assign(ambil(),TEMPLATE[b.dataset.t]());isiData(d);DIRTY=true;await periksa();await periksa()});
addEventListener("beforeunload",e=>{if(DIRTY){e.preventDefault();e.returnValue=""}});
(async()=>{SKEMA=await (await fetch("/api/skema")).json();bangun();
 const r=await fetch(`/api/slot/${TANGGAL}/${JAM}`);const j=await r.json();isiData(j.data||{});
 if(j.status_kirim)$("#status-kirim").innerHTML=`<span class="badge b-${j.status_kirim}">${j.status_kirim==='sent'?'sudah terkirim':j.status_kirim}</span>`;
 await periksa();await periksa();DIRTY=false})();
</script>{% endblock %}
