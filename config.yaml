# ============================================================================
#  config.yaml  -  pengaturan sistem SYNOP otomatis (F1.1)
#  Kredensial TIDAK ada di sini: simpan di file .env (lihat .env.example).
#  Path boleh relatif (terhadap folder proyek ini) atau absolut.
# ============================================================================
station:
  name: "Stasiun Meteorologi Sultan Thaha"   # teks yang dipilih di dropdown stasiun

urls:
  login: "https://bmkgsatu.bmkg.go.id/login"
  sinoptik: "https://bmkgsatu.bmkg.go.id/meteorologi/sinoptik"

paths:
  # SATU path Excel saja (sebelumnya ada dua versi path yang berbeda di script lama).
  excel: "legacy/INPUT_PARAMETER_baru.xlsx"
  db: "data/synop.db"
  snapshots: "snapshots"
  options: "core/options.json"
  rules: "core/rules.json"
  rules_qc: "core/rules_qc.json"   # F1.10
  # Gambar tombol OK popup awal (dipakai pyautogui seperti di V6SATU). Jika file tidak ada,
  # V7SATU mencoba mengklik popup lewat Selenium. Sesuaikan dengan lokasi ok.PNG Anda.
  ok_image: "legacy/ok.PNG"

web_ids:
  # [rev 27] ID elemen web untuk kolom bagian bawah jam 00 UTC. KOSONG = dicari otomatis lewat teks label.
  # Isi bila hasil skrip pemantau (tools/pantau_web.py) menunjukkan ID aslinya.
  penguapan_mm: ""
  penguapan_ie: ""
  penguapan_radiasi: ""
  penguapan_sinar_jam: ""

chrome:
  # [F3.3] Profil Chrome TETAP khusus bot, agar sesi login BMKG Satu tersimpan (login tidak berulang tiap bot dibuka).
  # Kosong = perilaku lama (profil sementara, login tiap kali). Contoh: "chrome_profile" (di folder proyek).
  # JANGAN diarahkan ke profil Chrome harian Anda. Folder ini berisi cookie sesi; jangan dibagikan / di-commit.
  profile_dir: "chrome_profile"
  # [rev 28] Chrome kadang terbuka tetapi tidak menuju BMKG Satu (profil terkunci oleh Chrome yatim). Bot kini memastikan
  # halaman benar-benar terbuka; bila gagal: tutup Chrome yatim yang memakai profil bot, hapus berkas kunci, coba lagi.
  retry_buka: 3                   # berapa kali Chrome dicoba dibuka sebelum menyerah
  fallback_profil_sementara: true # profil tetap gagal terus -> pakai profil sementara (login dari awal) daripada berhenti
  anti_throttle: true             # [rev 29] cegah Windows/Chrome melambatkan jendela bot saat tertutup jendela lain (pengisian lebih cepat)

# [rev 28] BMKG Satu bisa logout sendiri (sekitar tiap 1 jam, bahkan saat dipakai). Sebelum tiap eksekusi bot memeriksa
# sesi: bila sudah habis, login ulang otomatis (berlaku juga TANPA profil Chrome). Juga dideteksi bila logout terjadi di tengah pengisian.
session:
  aktif: true
  cek_sebelum_detik: 180          # periksa sesi sekian detik sebelum waktu eksekusi
  cek_ulang_menit: 10             # [rev 35] DIABAIKAN (pemeriksaan sesi kini pasif; tidak lagi memuat ulang halaman tiap jam)
  pantau_pasif_detik: 60          # [rev 35] saat menunggu: tiap sekian detik baca DOM mencari popup 'sesi habis' / halaman login
  # kata_popup: [sesi, session, expired]   # [rev 35] isi bila teks popup asli tak terdeteksi (lihat snapshots/*popup_sesi_habis*.html)

# [rev 35 / F3.9] health check selector: hanya MEMBACA halaman; lapor (Telegram jenis 'selector') bila id/label web hilang
health:
  aktif: true
  cek_detik: 600

runtime:
  timezone_offset_hours: 7        # WIB = UTC+7 (jam di web berbasis UTC)
  max_row_recovery: 2             # maks pemulihan sesi per baris
  window_open_minutes: 10         # web membuka jam 10 menit sebelum jam observasi
  late_info_minutes: 15           # eksekusi lebih lambat dari ini diberi catatan
  popup_wait_seconds: 1           # [rev 29] berapa kali (x1 dtk) mencari popup Chrome; popup tak pernah muncul sejak opsi anti-popup (F1.1)
  retry_past_minutes: 90          # >0: slot gagal/terhenti dicoba ulang s.d. sekian menit setelah waktu eksekusi (rev 30: bawaan 90)
  # [rev 30] CADANGAN bila pengisian gagal (sebelumnya langsung lompat ke jam berikutnya):
  max_row_attempts: 3             # total percobaan per jam: 1=normal, 2=setelah MUAT ULANG halaman, 3=setelah BUKA BROWSER BARU
  max_field_attempts: 3           # [rev 31] percobaan ULANG per field/klik (wajib 3, opsional 2) sebelum jam dianggap gagal -> baru tangga di atas
  max_row_menit: 25               # batas total waktu mengulang satu jam (menit)
  auto_restart_maks: 5            # bot berhenti karena galat tak terduga -> restart otomatis (maks per jam; 0 = mati)
  auto_restart_jeda_detik: 30

observers:
  # Kosong = pakai daftar observer aktif dari core/options.json.
  # Isi bila ingin membatasi pilihan di launcher, contoh: ["Nama Pengamat 1"]
  allowed: []

features:
  penguapan_strict: true          # rev 27: isian penguapan/radiasi jam 00 UTC diminta tapi gagal -> jam TIDAK dikirim (false = tetap kirim)
  extra_layers: true              # F3.10: isi lapisan tambahan (rendah-3, menengah-2, tinggi-2); false = dilewati
  verify_sandi: true              # F3.4: bandingkan sandi hasil Preview dengan data Excel (peringatan + log)
  sandi_block_on_mismatch: false  # true = batalkan KIRIM bila verifikasi sandi menemukan ERROR (data utama beda)
  qff_qfe_check: true             # periksa QFF-QFE setelah Fill AWS Digi (stasiun 27 m: sekitar 3.2 hPa)
  qff_qfe_expected_diff: 3.2
  qff_qfe_tolerance: 1.0
  send_despite_detail_fail: false # rev 14: true = tetap kirim walau Jenis/Jumlah/Arah wajib gagal diisi (TIDAK disarankan)
  dry_run: false                  # F1.7: true = isi form sampai Preview, tidak kirim
  allow_update: true              # jam yang sudah ada di web boleh ditimpa lewat tombol "Send & Update"
  rain_override_strict: false     # true = batalkan baris jika override hujan gagal diterapkan
  qc_enabled: true                # F1.10: aturan QC konsistensi (core/qc.py; PPT pusat + PDF AMG)
  qc_strict: false                # true = temuan QC "pasti" jadi ERROR (blok baris); false = hanya WARNING
  data_source: db              # F2.7: excel = INPUT_PARAMETER.xlsx (seperti biasa) | db = data dari form web (python app.py)
  qc_popup_auto_submit: true      # F3.11: popup web "Koreksi QC" (step check AWS) -> klik Submit otomatis; false = hanya catat + screenshot, baris GAGAL
  qc_popup_tunggu: 12             # F3.11: batas detik mengawasi popup susulan setelah OK terakhir
  qc_popup_tenang: 4              # F3.11: layar dianggap tenang bila tak ada popup selama N detik

# F3.7 notifikasi Telegram. Token & chat_id TIDAK di sini: isi TELEGRAM_BOT_TOKEN dan
# TELEGRAM_CHAT_ID di file .env (sudah di-.gitignore). Cek: python core/notify.py --test
notify:
  enabled: true
  kirim_gagal: true               # gagal kirim / dilewati karena validasi / skrip berhenti
  kirim_recovery: true            # pemulihan sesi browser berhasil/gagal
  kirim_diubah: true              # terkirim tetapi ada perubahan otomatis (mis. ww 10 -> 05)
  kirim_sukses: false             # true = pesan tiap jam terkirim (24x/hari)
  kirim_rekap: true               # ringkasan harian, sekali per hari UTC
  kirim_screenshot: true
  kirim_saat_dry_run: false
  alarm_suara: true               # bunyi lokal (Windows) saat gagal total
  rekap_jam_utc: "23:50"          # rekap hari UTC berjalan dikirim setelah jam ini
  nama_stasiun: "Sultan Thaha (96195)"

# F3.5 gerbang persetujuan: setelah Preview & verifikasi sandi, jendela hitung-mundur menampilkan sandi + [Batalkan] [Kirim sekarang].
# Tanpa tindakan data TETAP terkirim (auto-kirim). Tidak tampil bila --no-gui / tanpa layar. aktif:false = matikan.
gerbang:
  aktif: true
  detik: 20

# F2 form & dashboard web (python app.py). PIN opsional: isi WEB_PIN di .env
web:
  host: "0.0.0.0"                 # 0.0.0.0 = bisa dibuka dari PC lain di jaringan stasiun; 127.0.0.1 = hanya PC ini
  port: 8080
  menit_sebelum: 2                # bot mulai mengisi N menit sebelum jam observasi (data dari form)

# [rev 32] kecepatan pengisian form BMKG Satu (semua opsional; nilai di bawah = bawaan kode)
speed:
  scale: 0.5                      # pengali jeda tetap (1.0 = jeda asli V6)
  optional_timeout: 3             # batas tunggu field opsional (detik)
  fast_select: true               # jalur cepat dropdown: klik opsi (tanpa mengetik) + verifikasi; gagal -> jalur lama otomatis
  fast_input: true               # isi kotak angka lewat 1 render (bukan per karakter). AKTIFKAN setelah dry-run membuktikan sandi tetap sesuai
