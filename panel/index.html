<style>

*{box-sizing:border-box}

/* ---- tombol: hover naik, klik menekan + riak, sibuk = putar, sukses = cincin hijau, gagal = goyang ---- */

 box-shadow:0 1px 2px rgba(20,60,140,.25);transition:transform .12s var(--ease),box-shadow .18s,background .18s,border-color .18s,opacity .18s}

/* ---- toast & dialog ---- */
#tw{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:40;pointer-events:none}
.t{display:flex;align-items:center;gap:10px;background:var(--tx);color:var(--bg);padding:11px 15px;border-radius:11px;max-width:440px;box-shadow:var(--sh2);animation:tin .3s var(--ease);border-left:4px solid #6AA6FF}
.t.ok{border-left-color:#3DCB8A}.t.er{border-left-color:#FF6B6B}.t.out{opacity:0;transform:translateX(30px);transition:.25s}
#md,#qr{position:fixed;inset:0;background:rgba(6,12,22,.6);display:none;align-items:center;justify-content:center;z-index:30;backdrop-filter:blur(2px)}#md.on,#qr.on{display:flex;animation:fi .18s}

#qr div{background:#fff;padding:26px;border-radius:16px;text-align:center;color:#111;animation:pop .25s var(--ease)}#qr img{width:min(70vh,420px)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 currentColor;opacity:1}50%{box-shadow:0 0 0 4px transparent;opacity:.55}}
@keyframes pop{from{transform:scale(.9);opacity:.5}to{transform:none;opacity:1}}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fi{from{opacity:0}to{opacity:1}}

 if(lanjut.dataset.h!==h){lanjut.dataset.h=h;lanjut.innerHTML=h}}}};
/* ================= Log ================= */
V.log={bangun(){$('isi').innerHTML=`<div class="cd"><div class="ch"><select id="ln" style="width:auto" onchange="V.log.hidup()"><option value="bot">Bot pengirim</option><option value="web">Web form</option><option value="remote">Akses remote</option><option value="pantau">Pantau web</option></select>
 <button class="bt sc sm" onclick="salin($('lp').textContent)">Salin</button></div><pre class="log" id="lp"></pre></div>`;
 this.hidup=async()=>{const r=await api('/api/log?nama='+$('ln').value+'&n=400');const e=$('lp');if(!e)return;const h=warnai(r.baris);if(e.dataset.h===h)return;e.dataset.h=h;const b=e.scrollTop+e.clientHeight>=e.scrollHeight-30;e.innerHTML=h;if(b||!e.dataset.s){e.scrollTop=e.scrollHeight;e.dataset.s=1}}}};
/* ================= Pengaturan: tidak dibangun ulang saat menyimpan (posisi gulir tetap), bilah simpan menempel di bawah ================= */
let KOTOR=false;
function kotor(v=true){KOTOR=v;const s=$('sv');if(!s)return;s.classList.toggle('kotor',v);$('svt').textContent=v?'Ada perubahan yang belum disimpan':'Belum ada perubahan';$('svb').disabled=!v}
function togol(e){e.classList.toggle('on');const on=e.classList.contains('on');e.dataset.v=on?1:'';e.setAttribute('aria-checked',on);kotor()}
const statusR=x=>`<b>${esc(x.label)}</b><br><span class="sub">${x.terisi?'Terisi'+(x.tampil?' · '+esc(x.tampil):''):'Belum diisi'}</span>`;
V.cfg={bangun(){KOTOR=false;$('isi').innerHTML='<div id="b" class="pg"><div class="cd"><div class="sk" style="width:35%"></div><div class="sk"></div><div class="sk" style="width:75%"></div><div class="sk" style="width:55%"></div></div></div>';this.hidup=()=>{};
 api('/api/pengaturan').then(r=>{if(hal!='cfg'||!r.daftar)return;let g='',h='';
 r.daftar.forEach(d=>{if(d.grup!=g){h+=`${g?'</div>':''}<div class="cd"><div class="ch"><h2>${esc(d.grup)}</h2></div>`;g=d.grup}
 h+=`<div class="ln"><span class="grow">${esc(d.label)}<br><span class="sub mono">${d.kunci}</span></span>`+(d.tipe=='bool'?`<span class="sw ${d.nilai?'on':''}" role="switch" tabindex="0" aria-checked="${!!d.nilai}" data-k="${d.kunci}" data-t="bool" data-v="${d.nilai?1:''}" onclick="togol(this)" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();togol(this)}"></span>`:
 `<input style="width:120px" ${d.tipe=='int'?'type="number" min="'+d.batas[0]+'" max="'+d.batas[1]+'"':'type="text"'} data-k="${d.kunci}" data-t="${d.tipe}" value="${esc(d.nilai)}" oninput="kotor()">`)+'</div>'});
 h+=`</div><div class="cd"><div class="ch"><h2>Kredensial & rahasia</h2><span class="sub">Disimpan di .env, tidak pernah ditampilkan ulang</span></div>${r.rahasia.map(x=>`<div class="ln" id="row_${x.kunci}"><span class="grow" id="rs_${x.kunci}">${statusR(x)}</span>
 <input type="password" style="width:240px" placeholder="nilai baru" id="r_${x.kunci}" autocomplete="off" onkeydown="if(event.key=='Enter')simpanR('${x.kunci}')"><button class="bt sc sm" onclick="simpanR('${x.kunci}')">Simpan</button></div>`).join('')}</div>
 <div class="sv" id="sv"><span class="grow" id="svt">Belum ada perubahan</span><span class="sub">Disimpan di config.panel.yaml · berlaku saat komponen dijalankan ulang</span><button class="bt" id="svb" onclick="simpanCfg()" disabled>Simpan pengaturan</button></div>`;
 $('b').innerHTML=h})}};
async function simpanCfg(){const p={};document.querySelectorAll('#b [data-k]').forEach(e=>{p[e.dataset.k]=e.dataset.t=='bool'?!!e.dataset.v:(e.dataset.t=='int'?Number(e.value):e.value)});
 const r=await sibuk(api('/api/pengaturan',{perubahan:p}));toast(r.pesan,r.ok?'ok':'er');if(r.ok)kotor(false)}
async function simpanR(k,b=BT){const i=$('r_'+k),v=i.value;if(!v){toast('Isi nilainya dulu','er');i.focus();return}
 const r=await sibuk(api('/api/rahasia',{kunci:k,nilai:v}),b||i.nextElementSibling);toast(r.pesan,r.ok?'ok':'er');
 if(r.ok){i.value='';const c=await api('/api/pengaturan'),x=(c.rahasia||[]).find(z=>z.kunci==k),s=$('rs_'+k);if(x&&s)s.innerHTML=statusR(x);const w=$('row_'+k);if(w){w.classList.remove('flash');void w.offsetWidth;w.classList.add('flash')}}}
menu();muat().then(()=>cekUlang(null));setInterval(muat,3000);setInterval(()=>{if(hal=='beranda')cekUlang(null)},30000);
</script></body></html>
